[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyproxifier"
version = "0.1.0"
description = "A Python library for programmatic Proxifier management and automation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "I1Kuz", email = "i1marqueeit@gmail.com" }
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyproxifier*"]
